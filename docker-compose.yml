services:
  wpagent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
      WPAGENT_HTTP: "1"
      WPAGENT_HTTP_MODE: personal
      WPAGENT_HTTP_HOST: 0.0.0.0
      WPAGENT_HTTP_PORT: "3333"
      WPAGENT_PUBLIC_URL: http://127.0.0.1:3333
      WPAGENT_URL: ${WPAGENT_URL:-}
      WPAGENT_USERNAME: ${WPAGENT_USERNAME:-}
      WPAGENT_APP_PASSWORD: ${WPAGENT_APP_PASSWORD:-}
      WPAGENT_CORS_ORIGINS: "*"
    volumes:
      - wpagent-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wpagent-data:
